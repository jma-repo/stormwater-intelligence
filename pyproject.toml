[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stormwater-intelligence"
version = "0.1.0"
description = "Post-storm drainage-complaint risk ranking for Calgary communities (311 requests + City rain gauges)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.7",
  "matplotlib>=3.8",
  "requests>=2.31",
  "pyarrow>=14",
  "folium>=0.15",
  "rasterio>=1.3",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stormwater-intel = "stormwater_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
